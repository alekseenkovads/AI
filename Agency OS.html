function fillContractFromClient(clientName) {
  // Find all deals for this client and collect unique contracts
  const dealContracts = [...new Set(
    DB.deals.filter(d => d.client === clientName && d.contract && d.contract !== '—').map(d => d.contract)
  )];
  // Also from DB.clients
  const clientRec = DB.clients.find(c => c.name === clientName);
  const allContracts = [...new Set([
    ...(clientRec && clientRec.contract !== '—' ? [clientRec.contract] : []),
    ...dealContracts
  ])];
  const ct = document.getElementById('f-contract');
  const dd = document.getElementById('ac-f-contract');
  if (!ct) return;
  if (allContracts.length === 0) {
    ct.value = '';
    ct.placeholder = 'Введите номер договора...';
    if (dd) dd.style.display = 'none';
  } else if (allContracts.length === 1) {
    ct.value = allContracts[0];
    if (dd) dd.style.display = 'none';
  } else {
    // Multiple — show dropdown
    ct.value = allContracts[0];
    if (dd) {

// ============================================================  
// STICKY SCROLLBAR
// ============================================================
function initStickyScrollbars() {
  document.querySelectorAll('.table-wrap').forEach(wrap => {
    if (wrap.nextElementSibling && wrap.nextElementSibling.classList.contains('sticky-scroll-wrap')) return;
    const mirror = document.createElement('div');
    mirror.className = 'sticky-scroll-wrap';
    const inner = document.createElement('div');
    inner.className = 'sticky-scroll-inner';
    mirror.appendChild(inner);
    wrap.parentNode.insertBefore(mirror, wrap.nextSibling);
    const syncWidth = () => { const tbl = wrap.querySelector('table'); if (tbl) inner.style.width = tbl.scrollWidth + 'px'; };
    syncWidth();
    mirror.addEventListener('scroll', () => { wrap.scrollLeft = mirror.scrollLeft; });
    wrap.addEventListener('scroll', () => { mirror.scrollLeft = wrap.scrollLeft; });
  });
}

// ============================================================
// FILTER ROWS
// ============================================================
function filterRows(rows, table) {
  const u = USERS[currentUser];
  const role = u.role;
  const isManager = role === 'manager';
  const isBuyer = isManager && u.dept === 'Баинг';
  const isHead  = isManager && u.dept === 'Клиентский отдел';
  let r = rows;
  if (isManager) {
    r = r.filter(row => u.clients && u.clients.includes(row.client || row.vendor));
    if (isBuyer && table === 'payments_out') r = r.filter(row => row.manager === u.name);
    if (isBuyer && table === 'deals') r = r.filter(row => row.manager === u.name);
    if (isHead && table === 'deals') r = r.filter(row => u.clients && u.clients.includes(row.client));
  }
  const fs = filterStatus[table] || 'all';
  if (fs !== 'all') r = r.filter(row => row.status === fs);
  const fm = filterManager.deals || 'all';
  if (table === 'deals' && fm !== 'all') r = r.filter(row => row.manager === fm);
  return r;
}

// ============================================================
// MAKE STATUS / SORTABLE TH
// ============================================================
function makeStatusTh(table) {
  const statuses = table === 'payments_in'
    ? ['all','В работе','Оплачен','Просрочен','Ожидание']
    : ['all','В работе','Оплачено','Просрочено','Ожидание'];
  const cur = filterStatus[table] || 'all';
  const opts = statuses.map(s =>
    '<option value="' + s + '"' + (cur===s?' selected':'') + '>' +
    (s==='all' ? 'Все (' + filterStatusCount(table,s) + ')' : s) +
    '</option>'
  ).join('');
  return '<th class="th-filter"><span style="display:block;margin-bottom:2px">Статус</span>' +
    '<select class="th-filter-select' + (cur!=='all'?' filtered':'') + '" onchange="setFilterStatus(\'' + table + '\',this.value)">' +
    opts + '</select></th>';
}


function filterStatusCount(table, status) {
  const rows = table === 'payments_in' ? DB.payments_in : table === 'payments_out' ? DB.payments_out : DB.deals;
  return status === 'all' ? rows.length : rows.filter(r=>r.status===status).length;
}

// ============================================================
// SAVE / CANCEL DEAL ROW
// ============================================================
function saveDealRow(id) {
  const deal = DB.deals.find(d => d.id === id);
  if (!deal) return;
  const orig = window._editingOriginal || {};
  const row = document.querySelector('[data-deal-id="' + id + '"]');
  if (!row) return;
  const changes = [];
  const editableKeys = ['client','period','media','region','vendor','service','budget_p','budget_f','tax_type','sk','sk_date','ret','ret_date','pay_plan','pay_fact','contract','appendix','act','note','manager','nb_fee','client_ret'];
  row.querySelectorAll('[data-editkey]').forEach(inp => {
    const key = inp.dataset.editkey;
    if (!editableKeys.includes(key)) return;
    let newVal = inp.tagName === 'TEXTAREA' ? inp.value : inp.value || '—';
    if ((key==='pay_plan'||key==='pay_fact'||key==='sk_date'||key==='ret_date') && newVal && newVal!=='—' && newVal.includes('-')) {
      const p = newVal.split('-'); newVal = p[2]+'.'+p[1]+'.'+p[0];
    }
    if (key === 'act') newVal = (inp.value||'').split('\n').map(s=>s.trim()).filter(Boolean).join('|') || '—';
    if (newVal === '') newVal = '—';
    if (deal[key] !== newVal) {
      changes.push({field:key, from:deal[key], to:newVal});
      deal[key] = newVal;
      if (key === 'note') { const u = USERS[currentUser]; notifyMentions(u.name, deal.client, deal.period, newVal); }
    }
  });
  if (changes.length > 0) {
    const now = new Date();
    const ts = now.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    changes.forEach(c => addAuditEntry('Сделка', deal.client + ' / ' + deal.period, c.field, c.from, c.to));
  }
  window._editingOriginal = null;
  window._editingId = null;
  const banner = document.getElementById('edit-banner');
  if (banner) banner.remove();
  showTab('deals');
}

function cancelEditDeal() {
  if (window._editingOriginal && window._editingId) {
    const id = window._editingId;
    const deal = DB.deals.find(d => d.id === id);
    if (deal) Object.assign(deal, window._editingOriginal);
  }
  window._editingOriginal = null; window._editingId = null;
  const banner = document.getElementById('edit-banner');
  if (banner) banner.remove();
  showTab('deals');
}

// ============================================================
// BUILD DEALS SVOD HTML
// ============================================================
function buildDealsSvodHtml() {
  const u = USERS[currentUser];
  const role = u.role;
  const canEditAdmin = role === 'admin' || role === 'owner';
  const n = (s) => parseFloat((s||'0').replace(/[\s\u00a0]/g,'').replace('—','0')) || 0;
  const groups = {};
  DB.deals.forEach(d => {
    const key = (d.media||'—') + '||' + (d.region||'—') + '||' + (d.period||'—') + '||' + (d.service||'—');
    if (!groups[key]) groups[key] = {media:d.media||'—',region:d.region||'—',period:d.period||'—',service:d.service||'—',client:[],buying:[]};
    const uKey = Object.keys(USERS).find(k=>USERS[k].name===d.manager);
    const dept = uKey ? (USERS[uKey].dept||'') : '';
    if (dept === 'Баинг') groups[key].buying.push(d);
    else groups[key].client.push(d);
  });
  const sorted = Object.values(groups).sort((a,b) => parsePeriod(a.period) - parsePeriod(b.period));
  if (!sorted.length) return '<tr><td colspan="13" class="empty">Нет данных</td></tr>';
  const fmt = (v) => v > 0 ? '₽'+v.toLocaleString('ru-RU') : (v < 0 ? '−₽'+Math.abs(v).toLocaleString('ru-RU') : '—');
  return sorted.map(g => {
    const cPlan = g.client.reduce((a,d)=>a+n(d.budget_p),0);
    const cFact = g.client.reduce((a,d)=>a+n(d.budget_f),0);
    const cRet  = g.client.reduce((a,d)=>a+n(d.client_ret),0);
    const bPlan = g.buying.reduce((a,d)=>a+n(d.budget_p),0);
    const bFact = g.buying.reduce((a,d)=>a+n(d.budget_f),0);
    const sk    = g.buying.reduce((a,d)=>a+n(d.sk),0);
    const nbFee = [...g.client,...g.buying].reduce((a,d)=>a+n(d.nb_fee),0);
    const profPlan = cPlan - bPlan - cRet + sk - nbFee;
    const profFact = (cFact || bFact) ? cFact - bFact - cRet + sk - nbFee : 0;
    const retCell = canEditAdmin ? '<td><input class="edit-input" style="width:80px;font-size:12px" value="' + (cRet||'') + '" onchange="updateGroupField(\'' + g.media + '\',\'' + g.region + '\',\'' + g.period + '\',\'client_ret\',this.value)" placeholder="0"></td>' : '<td class="amount">' + fmt(cRet) + '</td>';
    const nbCell  = canEditAdmin ? '<td><input class="edit-input" style="width:80px;font-size:12px" value="' + (nbFee||'') + '" onchange="updateGroupField(\'' + g.media + '\',\'' + g.region + '\',\'' + g.period + '\',\'nb_fee\',this.value)" placeholder="0"></td>' : '<td class="amount">' + fmt(nbFee) + '</td>';
    return '<tr>' +
      '<td>' + g.media + '</td><td>' + g.region + '</td><td class="mono">' + g.period + '</td><td>' + g.service + '</td>' +
      '<td class="amount">' + fmt(cPlan) + '</td><td class="amount">' + fmt(cFact) + '</td>' + retCell +
      '<td class="amount" style="border-left:2px solid var(--border2)">' + fmt(bPlan) + '</td><td class="amount">' + fmt(bFact) + '</td>' +
      '<td class="amount">' + (sk>0?'+₽'+sk.toLocaleString('ru-RU'):'—') + '</td>' + nbCell +
      '<td class="amount" style="border-left:2px solid var(--border2);' + (profPlan<0?'color:var(--red)':'') + '">' + fmt(profPlan) + '</td>' +
      '<td class="amount" style="' + (profFact<0?'color:var(--red)':'') + '">' + fmt(profFact) + '</td>' +
      '</tr>';
  }).join('');
}

function updateGroupField(media, region, period, field, value) {
  const val = parseFloat(value) || 0;
  DB.deals.forEach(d => { if ((d.media||'—')===media && (d.region||'—')===region && d.period===period) d[field] = val > 0 ? String(val) : '—'; });
}
