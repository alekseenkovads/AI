function setSortSvod(col) {
  const s = sortState.svod;
  if (s.col === col) s.dir = -s.dir;
  else { s.col = col; s.dir = 1; }
  const tbody = document.getElementById('svod-tbody');
  if (tbody) tbody.innerHTML = buildSvodHtml();
  // Update header arrows
  document.querySelectorAll('#pt-svod th.sortable').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.dataset.col === col) th.classList.add(s.dir===1?'sort-asc':'sort-desc');
  });
  setTimeout(() => { document.querySelectorAll('.sticky-scroll-wrap').forEach(m=>m.remove()); initStickyScrollbars(); }, 50);
}

function buildCashGapMap() {
  const pd = (s) => { if (!s || s === '—') return null; const p = String(s).split('.'); return p.length === 3 ? +p[2]*10000 + +p[1]*100 + +p[0] : null; };
  const evs = [];
  DB.payments_in.forEach(r => {
    const s = parseFloat((r.sum_plan||'0').replace(/[\s\u00a0]/g,'')) || 0;
    const t = calcTax(s, r.tax_type || 'НДС 22%');
    const d = pd(r.date_pay && r.date_pay !== '—' ? r.date_pay : r.date_issue);
    if (d == null || (s + t) === 0) return;
    evs.push({ key: 'in-' + r.id, date: d, amt: s + t, out: 0 });
  });
  DB.payments_out.forEach(r => {
    const s = parseFloat((r.sum||'0').replace(/[\s\u00a0]/g,'')) || 0;
    const t = calcTax(s, r.tax_type || 'НДС 22%');
    const d = pd(r.date_fact && r.date_fact !== '—' ? r.date_fact : r.date_plan);
    if (d == null || (s + t) === 0) return;
    evs.push({ key: 'out-' + r.id, date: d, amt: -(s + t), out: 1 });
  });
  // Хронология; в один день консервативно: сначала оттоки, потом притоки
  evs.sort((a, b) => a.date - b.date || b.out - a.out);
  let bal = 0; const map = {};
  evs.forEach(e => { bal += e.amt; map[e.key] = { bal: bal }; });
  return map;
}

function buildSvodHtml() {
  const u = USERS[currentUser];
  const role = u.role;
  const isManager = role === 'manager';
  const parseDate = (s) => {
    if (!s || s === '—') return 99999999;
    const p = s.split('.');
    return p.length === 3 ? +p[2]*10000 + +p[1]*100 + +p[0] : 99999999;
  };
  const inRows = DB.payments_in.filter(r =>
    !isManager || (u.clients && u.clients.includes(r.client))
  );
  const outRows = DB.payments_out.filter(r =>
    !isManager || (u.clients && u.clients.includes(r.client))
  );
  const allRows = [
    ...inRows.map(r => ({ type:'in',  period:r.period, client:r.client, sortDate:parseDate(r.date_issue), data:r })),
    ...outRows.map(r => ({ type:'out', period:r.period, client:r.client, sortDate:parseDate(r.date_plan),  data:r }))
  ];
  if (!allRows.length) return '<tr><td colspan="18" class="empty">Нет данных</td></tr>';

  const svodSort = sortState.svod;
  allRows.sort((a, b) => {
    const col = svodSort.col, dir = svodSort.dir;
    if (col === 'period') {
      const pp = parsePeriod(a.period) - parsePeriod(b.period);
      return pp !== 0 ? pp * dir : (a.sortDate - b.sortDate) * dir;
    }
    if (col === 'client') return (a.client||'').localeCompare(b.client||'', 'ru') * dir;
    if (col === 'date_issue' || col === 'out_date_plan') return (a.sortDate - b.sortDate) * dir;
    if (col === 'date_pay') {
      const da = a.type==='in' ? parseDate(a.data.date_pay) : parseDate(a.data.date_fact);
      const db = b.type==='in' ? parseDate(b.data.date_pay) : parseDate(b.data.date_fact);
      return (da - db) * dir;
    }
    if (col === 'status') return ((a.data.status||'').localeCompare(b.data.status||'')) * dir;
    const pp2 = parsePeriod(a.period) - parsePeriod(b.period);
    return pp2 !== 0 ? pp2 : a.sortDate - b.sortDate;
  });

  const emptyIn  = '<td></td><td></td><td></td><td></td><td></td><td></td><td></td>';
  const emptyOut = '<td style="border-left:2px solid var(--border2)"></td><td></td><td></td><td></td><td></td><td></td><td></td>';

  let balance = 0;
  let grandIn = 0, grandOut = 0;
  let periodIn = {}, periodOut = {}, periodBal = {};

  // Pre-compute period totals
  allRows.forEach(row => {
    const p = row.period;
    if (!periodIn[p]) { periodIn[p] = 0; periodOut[p] = 0; }
    if (row.type === 'in') {
      const s = parseFloat((row.data.sum_plan||'0').replace(/[\s\u00a0]/g,''))||0;
      const t = calcTax(s, row.data.tax_type||'НДС 22%');
      periodIn[p] += s + t;
    } else {
      const s = parseFloat((row.data.sum||'0').replace(/[\s\u00a0]/g,''))||0;
      const t = calcTax(s, row.data.tax_type||'НДС 22%');
      periodOut[p] += s + t;
    }
  });

  // Build rows grouped by period with subtotals
  let html = '';
  let currentPeriod = null;
  let periodRowCount = 0;

  allRows.forEach((row, idx) => {
    const { type, period, client, data: r } = row;

    // Detect period change — insert subtotal for previous period
    if (currentPeriod && currentPeriod !== period) {
      const pIn = periodIn[currentPeriod] || 0;
      const pOut = periodOut[currentPeriod] || 0;
      const pBal = pIn - pOut;
      html += '<tr class="subtotal">' +
        '<td class="sub-label" colspan="2">↳ ' + currentPeriod + ' итого</td>' +
        '<td class="sub-amount">₽' + pIn.toLocaleString('ru-RU') + '</td>' +
        '<td></td><td></td><td></td><td></td><td></td><td></td>' +
        '<td style="border-left:2px solid var(--border2)"></td><td></td><td></td><td></td><td></td><td></td><td></td>' +
        '<td class="sub-amount" style="border-left:2px solid var(--border2);' + (pBal>=0?'':'color:var(--red)') + '">₽' + pBal.toLocaleString('ru-RU') + '</td>' +
        '</tr>';
    }
    currentPeriod = period;

    let rowAmt = 0;
    let rowHtml;
    if (type === 'in') {
      const s = parseFloat((r.sum_plan||'0').replace(/[\s\u00a0]/g,''))||0;
      const tax = calcTax(s, r.tax_type||'НДС 22%');
      const tot = s + tax;
      rowAmt = tot;
      grandIn += tot;
      const fv = factValue(r.sum_fact, r.period);
      const fvN = fv !== '—' ? parseFloat(fv.replace(/[\s\u00a0]/g,''))||0 : 0;
      rowHtml = '<td class="mono">' + period + '</td>' +
        '<td class="main">' + client + '</td>' +
        '<td class="amount">₽' + s.toLocaleString('ru-RU') + '</td>' +
        '<td style="font-size:11px">' + (r.tax_type||'НДС 22%') + '</td>' +
        '<td class="amount">' + (tax>0?'+₽'+tax.toLocaleString('ru-RU'):'—') + '</td>' +
        '<td class="amount">₽' + tot.toLocaleString('ru-RU') + '</td>' +
        '<td class="amount">' + (fvN>0?'₽'+fvN.toLocaleString('ru-RU'):'—') + '</td>' +
        '<td class="mono">' + (r.date_issue||'—') + '</td>' +
        '<td class="mono">' + (isFuturePeriod(r.period)?'—':(r.date_pay||'—')) + '</td>' +
        emptyOut;
    } else {
      const s = parseFloat((r.sum||'0').replace(/[\s\u00a0]/g,''))||0;
      const tax = calcTax(s, r.tax_type||'НДС 22%');
      const tot = s + tax;
      rowAmt = -tot;
      grandOut += tot;
      const fut = isFuturePeriod(r.period);
      rowHtml = '<td class="mono">' + period + '</td>' +
        '<td class="main">' + client + '</td>' +
        emptyIn +
        '<td style="border-left:2px solid var(--border2);font-size:12px">' + (r.vendor||'—') + '</td>' +
        '<td class="amount">₽' + s.toLocaleString('ru-RU') + '</td>' +
        '<td style="font-size:11px">' + (r.tax_type||'НДС 22%') + '</td>' +
        '<td class="amount">₽' + tot.toLocaleString('ru-RU') + '</td>' +
        '<td class="amount">' + (fut?'—':(tot>0?'₽'+tot.toLocaleString('ru-RU'):'—')) + '</td>' +
        '<td class="mono">' + (r.date_plan||'—') + '</td>' +
        '<td class="mono">' + (fut?'—':(r.date_fact||'—')) + '</td>';
    }

    balance += rowAmt;
    const balColor = balance >= 0 ? '' : 'color:var(--red)';
    const balCell = '<td style="border-left:2px solid var(--border2);' + balColor + '" class="amount">₽' + balance.toLocaleString('ru-RU') + '</td>';
    html += '<tr>' + rowHtml + balCell + '</tr>';
  });

  // Last period subtotal
  if (currentPeriod) {
    const pIn = periodIn[currentPeriod] || 0;
    const pOut = periodOut[currentPeriod] || 0;
    const pBal = pIn - pOut;
    html += '<tr class="subtotal">' +
      '<td class="sub-label" colspan="2">↳ ' + currentPeriod + ' итого</td>' +
      '<td class="sub-amount">₽' + pIn.toLocaleString('ru-RU') + '</td>' +
      '<td></td><td></td><td></td><td></td><td></td><td></td>' +
      '<td style="border-left:2px solid var(--border2)"></td><td></td><td></td><td></td><td></td><td></td><td></td>' +
      '<td class="sub-amount" style="border-left:2px solid var(--border2);' + (pBal>=0?'':'color:var(--red)') + '">₽' + pBal.toLocaleString('ru-RU') + '</td>' +
      '</tr>';
  }

  // Grand total row
  const grandBal = grandIn - grandOut;
  html += '<tr class="total-row">' +
    '<td colspan="2">ИТОГО</td>' +
    '<td class="sub-amount">₽' + grandIn.toLocaleString('ru-RU') + '</td>' +
    '<td></td><td></td><td></td><td></td><td></td><td></td>' +
    '<td class="sub-amount" style="border-left:2px solid var(--border2)">₽' + grandOut.toLocaleString('ru-RU') + '</td>' +
    '<td></td><td></td><td></td><td></td><td></td><td></td>' +
    '<td class="sub-amount" style="border-left:2px solid var(--border2);' + (grandBal>=0?'':'color:var(--red)') + '">₽' + grandBal.toLocaleString('ru-RU') + '</td>' +
    '</tr>';

  return html;
}


function switchPayTab(id) {
  payActiveTab = id;
  ['pt-in','pt-out','pt-svod'].forEach(i=>{
    const tab = document.getElementById('paytab-' + i);
    if (tab) {
      const active = (i === id);
      tab.style.borderBottomColor = active ? 'var(--gold)' : 'transparent';
      tab.style.color = active ? 'var(--gold)' : 'var(--muted)';
    }
    const d = document.getElementById(i);
    if (d) d.style.display = (i === id) ? 'block' : 'none';
  });
  if (id === 'pt-svod') {
    const tbody = document.getElementById('svod-tbody');
    if (tbody) tbody.innerHTML = buildSvodHtml();
  }
  setTimeout(() => { document.querySelectorAll('.sticky-scroll-wrap').forEach(m=>m.remove()); initStickyScrollbars(); }, 60);
}

function renderDeals() {
  const u = USERS[currentUser];
  const role = u.role;
  const isManager = role === 'manager';
  const _dCli = isManager ? mgrClients(u,'client') : [];
  const _dBuy = isManager ? mgrClients(u,'buying') : [];
  const _hasCliD = _dCli.length > 0, _hasBuyD = _dBuy.length > 0;
  const isBuyer = isManager && _hasBuyD && !_hasCliD; // чистый баер
  const isHead = isManager && _hasCliD && !_hasBuyD;  // чистый клиентский
  const canAdd = ROLE_CONFIG[role].canAdd && role !== 'lawyer';

  // Пер-проектные роли:
  // клиентская сторона — все строки клиентов, где он М (от всех менеджеров);
  // баинговая сторона — только свои строки (manager === u.name) по клиентам, где он Б
  const rows = isManager
    ? DB.deals.filter(r => {
        const side = sideOfDeal(r);
        if (side === 'buying') return _dBuy.includes(r.client) && r.manager === u.name;
        return _dCli.includes(r.client);
      })
    : DB.deals;

  // Sort + filter deals
  const dealActFilter = filterStatus.deals;
  // Dept filter — для менеджеров выводится из пер-проектных ролей
  const _effectiveDept = isManager
    ? (isBuyer ? 'buying' : isHead ? 'client' : (filterDealDept === 'buying' ? 'buying' : 'client'))
    : filterDealDept;
  // Вид (клиентский/баинговый) определяет видимость колонок
  const buyView = isManager ? (_effectiveDept === 'buying') : isBuyer;

  // Column visibility based on buying/non-buying VIEW
  const visibleCols = DEAL_COLS.cols.filter(c => {
    if (c.visible === 'all') return true;
    if (c.visible === 'no_buying') return !buyView; // клиентский вид видит эти колонки, баинговый нет
    if (c.visible === 'buying_only') return buyView || role === 'admin' || role === 'owner' || role === 'buh';
    return c.visible.includes(role);
  });

  // Pending approval filter - applied later when iterating

  const deptFiltered = (_effectiveDept === 'all' || _effectiveDept === 'svod') ? rows : rows.filter(d =>
    sideOfDeal(d) === (_effectiveDept === 'buying' ? 'buying' : 'client')
  );
  // Pending approval filter
  const pendingApprFilter = window._pendingApprovalFilter;
  const filteredForApproval = pendingApprFilter
    ? deptFiltered.filter(d => !d[pendingApprFilter] && d.deal_status !== 'Черновик' && d.deal_status !== 'Закрыта')
    : deptFiltered;
  let dealRows = filteredForApproval.filter(r => {
    if (dealActFilter !== 'all') {
      const act = r.act || '—';
      if (dealActFilter === 'Получен' && !(act !== '—' && act.startsWith('АКТ'))) return false;
      if (dealActFilter === 'Ожидание' && !(act === 'Ожидание' || act === 'Частично')) return false;
      if (dealActFilter === '—' && act !== '—') return false;
    }
    if (filterManager.deals !== 'all' && r.manager !== filterManager.deals) return false;
    return true;
  });
  dealRows = sortRows(dealRows, sortState.deals.col, sortState.deals.dir);
  const isByPeriodDeals = sortState.deals.col === 'period';

  // Sortable th helper for deals
  const thD = (col, label) => {
    const s = sortState.deals;
    const cls = s.col === col ? (s.dir === 1 ? 'sort-asc' : 'sort-desc') : '';
    const collapseBtn = col === 'period' ? ' <button id="collapse-btn-deals" class="collapse-btn" style="font-size:9px;padding:2px 8px;margin-left:6px;vertical-align:middle" onclick="event.stopPropagation();toggleCollapse(\'deals\')">' + (collapseState.deals ? '▶' : '▼') + '</button>' : '';
    return '<th class="sortable ' + cls + '" onclick="setSortDeals(\'' + col + '\')">' + label + '<span class="sort-arrow"></span>' + collapseBtn + '</th>';
  };

  // Status th with filter for deals (filter by act)
  const makeActTh = () => {
    const cur = filterStatus.deals;
    const opts = [
      ['all', 'Все (' + rows.length + ')'],
      ['Получен', 'Акт получен'],
      ['Ожидание', 'Частично / Ожидание'],
      ['—', 'Нет акта'],
    ];
    let optsHtml = opts.map(o => '<option value="' + o[0] + '"' + (cur===o[0]?' selected':'') + '>' + o[1] + '</option>').join('');
    return '<th class="th-filter"><span style="display:block;margin-bottom:2px">Act</span>' +
      '<select class="th-filter-select' + (cur!=='all'?' filtered':'') + '" onchange="setFilterDeals(this.value)">' + optsHtml + '</select></th>';
  };

  const renderCell = (c, r, role) => {
    const canEdit = c.edit.includes(role);
    let val = r[c.key] || '—';
    if (c.key === 'dept') {
      const mk = Object.keys(USERS).find(k => USERS[k].name === r.manager);
      const d = mk ? (USERS[mk].dept || '') : '';
      if (d === 'Баинг') return '<td data-key="dept"><span style="font-size:10px;padding:2px 8px;border-radius:3px;background:#eef2f9;color:#2c5f8a;white-space:nowrap">Баинг</span></td>';
      if (d === 'Клиентский отдел') return '<td data-key="dept"><span style="font-size:10px;padding:2px 8px;border-radius:3px;background:#eef7f2;color:#2d7a4f;white-space:nowrap">Клиент</span></td>';
      return '<td data-key="dept" class="mono" style="color:var(--dim)">—</td>';
    }
    if (c.key === 'ret') {
      if (!val || val === '—') return '<td data-key="ret" class="locked-cell mono">—</td>';
      return '<td data-key="ret" class="amount" style="color:var(--muted)">−₽' + val + '</td>';
    }
    if (c.key === 'ret_date') {
      return '<td data-key="ret_date" class="mono">' + (val||'—') + '</td>';
    }
    if (c.key === 'interest_pct' || c.key === 'target_margin') {
      const pct = (val && val !== '—') ? val.toString().replace('%','') + '%' : '—';
      const col = c.key === 'interest_pct' ? 'var(--gold)' : 'var(--blue)';
      return '<td data-key="' + c.key + '" class="mono" style="color:' + (pct==='—'?'var(--dim)':col) + '" title="' + c.label + ' — задаёт лид на входе (вводные от ньюбиза)">' + pct + '</td>';
    }
    if (c.key === 'service_type') {
      const stypes = ['Digital / Контекст','Digital / Программатик','Social / Таргет','Social / Promo','In-Game','Influencer','OOH','TV','Prize Fund','Email','Брендинг','Прочее'];
      if (!canEdit) return '<td data-key="service_type"><span style="font-size:11px;background:var(--surface2);padding:1px 6px;border-radius:2px">' + (val||'—') + '</span></td>';
      const opts = stypes.map(s => '<option' + (s===val?' selected':'') + '>' + s + '</option>').join('');
      return '<td data-key="service_type"><select class="edit-input" data-editkey="service_type" style="font-size:11px;padding:2px 4px;width:100%;min-width:140px">' + opts + '</select></td>';
    }
    if (c.key === 'region') {
      if (!val || val === '—') return '<td data-key="region" class="locked-cell">—</td>';
      return '<td data-key="region">' + val + '</td>';
    }
    if (c.key === 'deal_status') {
      const cssMap = {'Черновик':'ds-draft','На апруфе':'ds-review','Апрувнуто':'ds-approved','В работе':'ds-active','Закрыта':'ds-closed'};
      const cls = cssMap[val] || 'ds-draft';
      const canApprove = ['admin','buh'].includes(role);
      const dealObj = DB.deals.find(d => d.id === r?.id);
      if (!dealObj) return '<td><span class="badge ' + cls + '">' + (val||'Черновик') + '</span></td>';
      const alexOk  = dealObj.approve_alex  ? '✓' : '○';
      const nastyaOk= dealObj.approve_nastya ? '✓' : '○';
      const rodionOk= dealObj.approve_rodion ? '✓' : '○';
      const alexCls = dealObj.approve_alex  ? 'approved' : '';
      const nastyCls= dealObj.approve_nastya ? 'approved' : '';
      const rodCls  = dealObj.approve_rodion ? 'approved' : '';
      const dotsRow = '<div style="font-size:10px;color:var(--muted);margin-top:3px" title="Лид · Бухгалтерия · Ньюбиз">Лид:' + alexOk + '&nbsp;Бух:' + nastyaOk + '&nbsp;НБ:' + rodionOk + '</div>';
            let html = '<td data-key="deal_status" style="white-space:nowrap;min-width:160px">' +
        '<div><span class="badge ' + cls + '">' + (val||'Черновик') + '</span></div>';
      if (canApprove || role === 'owner') {
        const myHandle = (USERS[currentUser]||{}).handle || '';
        const isAlex   = myHandle === 'alex';
        const isNastya = myHandle === 'nastya';
        const isRodion = myHandle === 'rodion' || role === 'owner';
        if (isAlex) {
          html += '<div style="margin-top:5px;font-size:11px">📋 Лид:&nbsp;' +
            '<button class="approve-btn ' + alexCls + '" title="Апрувнуть" onclick="toggleApprove(' + dealObj.id + ',\'alex\')">✓ Апруф</button>&nbsp;' +
            '<button class="approve-btn rejected" title="Отклонить" onclick="rejectDeal(' + dealObj.id + ',\'alex\')">✗</button></div>';
        }
        if (isNastya) {
          html += '<div style="margin-top:3px;font-size:11px">💰 Бух:&nbsp;' +
            '<button class="approve-btn ' + nastyCls + '" title="Апрувнуть" onclick="toggleApprove(' + dealObj.id + ',\'nastya\')">✓ Апруф</button>&nbsp;' +
            '<button class="approve-btn rejected" title="Отклонить" onclick="rejectDeal(' + dealObj.id + ',\'nastya\')">✗</button></div>';
        }
        if (isRodion) {
          html += '<div style="margin-top:3px;font-size:11px">🚪 НБ:&nbsp;' +
            '<button class="approve-btn ' + rodCls + '" title="Последний шлюз: интерес клиента учтён, сделка может уйти за контур" onclick="toggleApprove(' + dealObj.id + ',\'rodion\')">✓ Апруф</button>&nbsp;' +
            '<button class="approve-btn rejected" title="Отклонить" onclick="rejectDeal(' + dealObj.id + ',\'rodion\')">✗</button></div>';
        }
        html += dotsRow;
        // Кнопка закрытия — только лид сделки/админ, только «В работе»
        if ((role === 'admin' || (USERS[currentUser]||{}).name === dealObj.lead) && dealObj.deal_status === 'В работе') {
          html += '<div style="margin-top:4px"><button onclick="closeDeal(' + dealObj.id + ')" style="font-size:10px;padding:3px 10px;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text)" title="Закрыть: все оплаты прошли, закрывающие подписаны">🏁 Проект закрыт</button></div>';
        }
        if (role === 'admin' && dealObj.deal_status === 'Закрыта') {
          html += '<div style="margin-top:4px"><button onclick="reopenDeal(' + dealObj.id + ')" style="font-size:10px;padding:2px 8px;cursor:pointer;border:1px dashed var(--border2);background:transparent;color:var(--muted)">↩ Переоткрыть</button></div>';
        }
      } else {
        html += dotsRow;
      }
      html += '</td>';
      return html;

    if (c.key === 'note') {
      if (!val || val === '—') return '<td data-key="note" class="note-cell"></td>';

    if (c.key === 'contract_status') {

      if (role === 'admin' || role === 'owner') {
        const opts = ['Не подписан','Отправлен','Подписан'].map(s =>
          '<option value="' + s + '"' + (cs===s?' selected':'') + '>' + (csLabel[s]||s) + '</option>'

    if (c.key === 'act') {
      if (!val || val === '—') return '<td data-key="act" class="act-cell">—</td>';

      if (acts.length === 0) return '<td data-key="act" class="act-cell">—</td>';
      const actsHtml = acts.map(a => '<div class="act-line">' + a + '</div>').join('');
      return '<td data-key="act" class="act-cell">' + actsHtml + '</td>';

    if (c.key === 'tax_type') {
      const canEdit = c.edit.includes(role);

        if ((v||'').startsWith('НДС')) return {bg:'var(--blue-bg)',col:'var(--blue)'};
        if ((v||'').startsWith('УСН')) return {bg:'var(--gold-bg)',col:'var(--gold)'};
        return {bg:'var(--red-bg)',col:'var(--red)'}; // НАЛ

        const opts = taxOpts.map(o =>
          '<option value="' + o + '"' + (val === o ? ' selected' : '') + '>' + o + '</option>'

        return '<td data-key="tax_type"><select onchange="updateDeal(' + r.id + ',\'tax_type\',this.value)" style="border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:\'DM Sans\';font-size:13px;padding:3px 8px;cursor:pointer;outline:none;width:auto">' + opts + '</select></td>';
      }
      return '<td data-key="tax_type"><span class="badge">' + val + '</span></td>';
    }
    if (c.key === 'sk') {
      if (val === '—' || !val) return '<td data-key="sk" class="locked-cell mono">—</td>';
      return '<td data-key="sk" class="amount" style="color:var(--green)">₽' + val + '</td>';
    }
    if (c.key === 'sk_date') {
      if (val === '—' || !val) return '<td data-key="sk_date" class="mono" style="color:var(--dim)">—</td>';
      return '<td data-key="sk_date" class="mono" style="color:var(--green)">' + val + '</td>';
    }
    if (c.key === 'service') {
      const approved = r.service_approved === true || r.service_approved === 'true';
      const canApprove = role === 'buh' || role === 'admin' || role === 'owner';
      const approveBtn = (!approved && canApprove)
        ? ' <button class="approve-btn" data-dealid="' + r.id + '" onclick="approveService(+this.dataset.dealid)" title="Подтвердить формулировку">✓ Апруф</button>'
        : '';
      // Show who still needs to approve
      let pendingWho = [];
      if (!r.approve_nastya) pendingWho.push('Настя');
      if (!r.approve_alex)   pendingWho.push('Алекс');
      const indicator = (r.deal_status === 'На апруфе' && pendingWho.length)
        ? ' <span class="approval-pending" title="Ожидается апруф от: ' + pendingWho.join(', ') + '">⏳ ' + pendingWho.join(' + ') + '</span>'
        : (r.deal_status === 'На апруфе' ? ' <span class="approval-pending">⚠ ожидает апруфа</span>' : '');
      return '<td data-key="service" class="service-cell' + (!approved ? '' : '') + '">' + (val || '—') + indicator + approveBtn + '</td>';
    }
    if (c.key === 'tax_sum') {
      // Computed: budget_p * tax_rate
      const bp = parseFloat((r.budget_p||'0').replace(/\s/g,'')) || 0;
      const tax = calcTax(bp, r.tax_type || 'НДС');
      return '<td data-key="tax_sum" class="mono" style="color:var(--muted);font-size:11px">' + (tax > 0 ? '+₽'+tax.toLocaleString('ru-RU') : '—') + '</td>';
    }
    if (c.key === 'total_p') {
      // budget_p + tax
      const bp2 = parseFloat((r.budget_p||'0').replace(/\s/g,'')) || 0;
      const tax2 = calcTax(bp2, r.tax_type || 'НДС');
      const total = bp2 + tax2;
      return '<td data-key="total_p" class="amount" style="font-weight:600">' + (total > 0 ? '₽'+total.toLocaleString('ru-RU') : '—') + '</td>';
    }
    if (c.key === 'av_sum' || c.key === 'budget_p') {
      return '<td data-key="' + c.key + '" class="' + (canEdit?'amount':'locked-cell mono') + '">' + (val !== '—' ? '₽'+val : '—') + '</td>';
    }
    if (c.key === 'budget_f') {
      // No fact for future periods
      if (isFuturePeriod(r.period)) return '<td data-key="budget_f" class="locked-cell mono" title="Период ещё не закрыт">—</td>';
      if (val === '—' || !val) return '<td data-key="budget_f" class="' + (canEdit?'amount':'locked-cell mono') + '">—</td>';
      const baseSum = parseFloat(val.replace(/\s/g,'')) || 0;
      const taxType = r.tax_type || 'НДС';
      const tax = calcTax(baseSum, taxType);
      const total = baseSum + tax;
      const taxLabel = tax > 0 ? ' <span style="font-size:9px;color:var(--muted);font-family:DM Sans">(+' + taxType + ')</span>' : '';
      return '<td data-key="budget_f" class="amount">₽' + total.toLocaleString('ru-RU') + taxLabel + '</td>';
    }
    if (c.key === 'manager') return '<td data-key="manager"><span class="mtag">' + val + '</span></td>';
    if (c.key === '__never__') return '';
    const extraCls = (c.key==='client'?'main':'') + ' ' + (c.key==='contract'||c.key==='appendix'||c.key==='vendor'?'mono':'');
    return '<td data-key="' + c.key + '" class="' + (canEdit?'':' locked-cell') + ' ' + extraCls + '">' + val + '</td>';
  };

  // Build thead
  const thead = visibleCols.map(c => {
    if (c.key === 'act') return makeActTh();
    if (['client','period','media','vendor','budget_p','budget_f','pay_plan'].includes(c.key)) {
      const wrapCls = ['budget_p','budget_f'].includes(c.key) ? ' wrap' : '';
      const s = sortState.deals;
      const cls = s.col === c.key ? (s.dir === 1 ? 'sort-asc' : 'sort-desc') : '';
      const collapseBtn = c.key === 'period' ? ' <button id="collapse-btn-deals" class="collapse-btn" style="font-size:9px;padding:2px 8px;margin-left:6px;vertical-align:middle" onclick="event.stopPropagation();toggleCollapse(\'deals\')">' + (collapseState.deals ? '▶' : '▼') + '</button>' : '';
      return '<th class="sortable' + wrapCls + ' ' + cls + '" onclick="setSortDeals(\'' + c.key + '\')">' + c.label + '<span class="sort-arrow"></span>' + collapseBtn + '</th>';
    }
    if (c.key === 'manager' && (!isManager || isHead)) {
      // Show only managers relevant to current tab
      const tabDept = filterDealDept === 'client' ? 'Клиентский отдел'
                    : filterDealDept === 'buying' ? 'Баинг' : null;
      const allMgrs = [...new Set(DB.deals.map(d => d.manager))].filter(Boolean);
      const withDept = allMgrs.map(m => {
        const uKey = Object.keys(USERS).find(k => USERS[k].name === m);
        const dept = uKey ? (USERS[uKey].dept||'') : '';
        return { name: m, dept };
      }).filter(({dept}) => !tabDept || dept === tabDept)
        .sort((a,b) => a.name.localeCompare(b.name, 'ru'));
      const cur = filterManager.deals;
      const label = filterDealDept === 'client' ? 'Клиент. менеджер'
                  : filterDealDept === 'buying' ? 'Баер' : 'Менеджер';
      let opts = '<option value="all">Все</option>';
      withDept.forEach(({name}) => {
        opts += '<option value="' + name + '"' + (cur===name?' selected':'') + '>' + name + '</option>';
      });
      return '<th class="th-filter"><span style="display:block;margin-bottom:2px">' + label + '</span><select class="th-filter-select' + (cur!=='all'?' filtered':'') + '" onchange="setManagerFilter(this.value)">' + opts + '</select></th>';
    }
    const canEdit = c.edit.includes(role);
    return '<th class="' + (canEdit?'':'locked') + '">' + (!canEdit?'<span class="lock-icon">🔒</span>':'') + c.label + '</th>';
  }).join('');

  // Build tbody with optional subtotals
  let tbody = '';
  if (!dealRows.length) {
    tbody = '<tr><td colspan="' + visibleCols.length + '" class="empty">Нет данных для вашего профиля</td></tr>';
  } else {
    // Group by ANY sorted column — dynamic subtotals
    const sortCol = sortState.deals.col;
    const groupableCols = ['period','client','vendor','media','tax_type','manager'];
    const doGroup = groupableCols.includes(sortCol);
    
    const bpIdx  = visibleCols.findIndex(c => c.key === 'budget_p');
    const bfIdx  = visibleCols.findIndex(c => c.key === 'budget_f');
    const skIdx  = visibleCols.findIndex(c => c.key === 'sk');
    const taxSumIdx = visibleCols.findIndex(c => c.key === 'tax_sum');
    const totalPIdx = visibleCols.findIndex(c => c.key === 'total_p');

    if (doGroup) {
      const groups = {}, order = [];
      dealRows.forEach(r => {
        const key = r[sortCol] || '—';
        if (!groups[key]) { groups[key] = []; order.push(key); }
        groups[key].push(r);
      });
      const editCols = !isBuyer ? '<td></td>' : '';
    const mgrCols2_in = !isManager ? '<td></td>' : '';
    let grandPlan = 0, grandFact = 0, grandSk = 0, grandTax = 0, grandTotalP = 0;
      order.forEach(key => {
        let pPlan = 0, pFact = 0, pSk = 0, pTax = 0, pTotalP = 0;
        groups[key].forEach(r => {
          const canEditRole = ['admin','manager'].includes(role);
        const editBtn = canEditRole ? '<td data-key="actions"><button class="edit-btn-edit" onclick="editDealRow(' + r.id + ')">✏</button></td>' : '<td></td>';

        tbody += '<tr class="' + rowClass + '" data-deal-id="' + r.id + '">' + visibleCols.map(c => renderCell(c, r, role)).join('') + editBtn + '</tr>';
        // ВОЗВРАТ sub-row (клиентская часть)
        if ((isHead || role === 'admin' || role === 'owner') && r.ret && r.ret !== '—') {
          const retColspan = visibleCols.length + 1;
          const bpRetIdx = visibleCols.findIndex(c => c.key === 'budget_p');
          const ppRetIdx = visibleCols.findIndex(c => c.key === 'pay_plan');
          let retCells = '<td style="padding:4px 8px 4px 28px;white-space:nowrap;font-style:italic;color:var(--muted);font-size:11px">↳ Возврат</td>';
          for (let ri = 1; ri < retColspan; ri++) {
            const rk = ri < visibleCols.length ? visibleCols[ri].key : 'actions';
            if (rk === 'budget_p') retCells += '<td class="amount" style="color:var(--muted)">−₽' + r.ret + '</td>';
            else if (rk === 'pay_plan') retCells += '<td class="mono" style="color:var(--muted)">' + (r.ret_date||'—') + '</td>';
            else retCells += '<td></td>';
          }
          tbody += '<tr class="detail-row-deals" style="background:var(--surface2)">' + retCells + '</tr>';
        }
                // ВОЗВРАТ sub-row (клиентская часть — агентство платит клиенту)
        if ((isHead || role === 'admin' || role === 'owner') && r.ret && r.ret !== '—') {
          const retSpan = visibleCols.length + 1;
          const bpRetI = visibleCols.findIndex(c => c.key === 'budget_p');
          const ppRetI = visibleCols.findIndex(c => c.key === 'pay_plan');
          let retCells = '<td style="padding:4px 8px 4px 28px;white-space:nowrap;font-style:italic;color:var(--muted);font-size:11px">↳ Возврат</td>';
          for (let ri = 1; ri < retSpan; ri++) {

            else retCells += '<td></td>';
          }

function calcPnL() {
  const byPeriod = {};
  DB.payments_in.forEach(r => {
    if (!byPeriod[r.period]) byPeriod[r.period] = {inc:0,out:0,opex:0,sk:0};
    const v = parseFloat((r.sum_fact !== '—' ? r.sum_fact : r.sum_plan||'0').replace(/[\s ]/g,'')) || 0;
    byPeriod[r.period].inc += v;
  });
  DB.payments_out.forEach(r => {
    if (!byPeriod[r.period]) byPeriod[r.period] = {inc:0,out:0,opex:0,sk:0};
    const s = parseFloat((r.sum||'0').replace(/[\s ]/g,'')) || 0;
    byPeriod[r.period].out += s + calcTax(s, r.tax_type||'НДС 22%');
  });
  DB.opex.forEach(r => {
    if (!byPeriod[r.period]) byPeriod[r.period] = {inc:0,out:0,opex:0,sk:0};
    byPeriod[r.period].opex += parseFloat((r.sum||'0').replace(/[\s ]/g,'')) || 0;
  });
  // СК = вознаграждение от подрядчика → ДОХОД агентства
  // ВОЗВРАТ = вознаграждение клиенту → РАСХОД агентства
  DB.deals.forEach(r => {
    const period = r.period;
    if (!byPeriod[period]) byPeriod[period] = {inc:0,out:0,opex:0,sk:0,ret:0};
    if (r.sk && r.sk !== '—') {
      byPeriod[period].sk += parseFloat(r.sk.replace(/[\s\u00a0]/g,'')) || 0;
    }
    if (r.ret && r.ret !== '—') {
      byPeriod[period].ret += parseFloat(r.ret.replace(/[\s\u00a0]/g,'')) || 0;
    }
  });
  return byPeriod;
}

function renderPnLTable() {
  const d = calcPnL();
  const periods = Object.keys(d).sort((a,b) => parsePeriod(a) - parsePeriod(b));
  if (!periods.length) return '<p style="color:var(--muted);padding:16px">Нет данных</p>';
  let totIn=0, totOut=0, totOp=0;
  let totSk=0, totRet=0;
  const rows = periods.map(p => {
    const r = d[p];
    const sk = r.sk || 0;
    const ret = r.ret || 0;
    const av = r.inc - r.out + sk;  // АВ + СК от подрядчика
    const profit = av - r.opex - ret;
    const margin = (r.inc+sk) > 0 ? Math.round(profit / (r.inc+sk) * 100) : 0;
    totIn+=r.inc; totOut+=r.out; totOp+=r.opex; totSk+=sk; totRet+=ret;
    const profCss = profit < 0 ? 'color:var(--red)' : '';
    return '<tr><td class="mono">' + p + '</td>' +
      '<td class="amount">₽' + r.inc.toLocaleString('ru-RU') + '</td>' +
      '<td class="amount">₽' + r.out.toLocaleString('ru-RU') + '</td>' +
      '<td class="amount">' + (sk>0?'+₽'+sk.toLocaleString('ru-RU'):'—') + '</td>' +
      '<td class="amount">₽' + av.toLocaleString('ru-RU') + '</td>' +
      '<td class="amount">₽' + r.opex.toLocaleString('ru-RU') + '</td>' +
      '<td class="amount" style="color:var(--muted)">' + (ret>0?'−₽'+ret.toLocaleString('ru-RU'):'—') + '</td>' +
      '<td class="amount" style="' + profCss + '">₽' + profit.toLocaleString('ru-RU') + '</td>' +
      '<td class="mono" style="' + profCss + '">' + margin + '%</td></tr>';
  }).join('');
  const totAv = totIn - totOut + totSk;
  const totPr = totAv - totOp - totRet;
  const totMg = (totIn+totSk) > 0 ? Math.round(totPr / (totIn+totSk) * 100) : 0;
  return '<div class="table-wrap"><table style="min-width:720px">' +
    '<thead><tr><th>Период</th><th>Входящие (клиенты)</th><th>Исходящие (подрядчики)</th>' +
    '<th>СК от подрядчика</th><th>Валовая (АВ + СК)</th><th>ОПЕКС</th><th>Возврат клиенту</th><th>Чистая прибыль</th><th>Маржа %</th></tr></thead>' +
    '<tbody>' + rows +
    '<tr class="total-row"><td>ИТОГО</td>' +
    '<td class="sub-amount">₽' + totIn.toLocaleString('ru-RU') + '</td>' +
    '<td class="sub-amount">₽' + totOut.toLocaleString('ru-RU') + '</td>' +
    '<td class="sub-amount">' + (totSk>0?'+₽'+totSk.toLocaleString('ru-RU'):'—') + '</td>' +
    '<td class="sub-amount">₽' + totAv.toLocaleString('ru-RU') + '</td>' +
    '<td class="sub-amount">₽' + totOp.toLocaleString('ru-RU') + '</td>' +
    '<td class="sub-amount" style="color:var(--muted)">' + (totRet>0?'−₽'+totRet.toLocaleString('ru-RU'):'—') + '</td>' +
    '<td class="sub-amount" style="' + (totPr<0?'color:var(--red)':'') + '">₽' + totPr.toLocaleString('ru-RU') + '</td>' +
    '<td class="sub-amount">' + totMg + '%</td></tr>' +
    '</tbody></table></div>';
}

    </div>
    <div class="section" style="margin-bottom:28px">
      <div class="section-header">
        <div>
          <div class="section-title">P&L — Финансовый результат</div>
          <div class="section-sub">Входящие − Исходящие = АВ агентства &nbsp;·&nbsp; АВ − ОПEX = Чистая прибыль</div>
        </div>
      </div>
      ${renderPnLTable()}
    </div>
    <div class="section">
      <div class="section-header">
        <div><div class="section-title">Операционные расходы</div><div class="section-sub">Операционные расходы агентства</div></div>
        ${(canAdd || ROLE_CONFIG[USERS[currentUser].role].canAddOpex) ? `<button class="add-btn" onclick="openModal('opex')">+ Добавить расход</button>` : ''}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Category</th><th>Item</th><th>Sum</th><th>Период</th><th>Pay Date</th><th>Vendor</th><th>Status</th><th>Note</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div class="section" style="margin-top:28px">
      <div class="section-header"><div><div class="section-title">Cash Flow — помесячно</div><div class="section-sub">Входящие vs Исходящие vs Opex (план)</div></div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Период</th><th>Incoming Plan</th><th>Outgoing Vendors</th><th>Opex</th><th>Net</th><th>Cumulative</th></tr></thead>
        <tbody id="cf-tbody"></tbody>
      </table></div>
    </div>
  `;
  // fill cash flow
  const months = ['Май 2026','Июн 2026','Июл 2026','Авг 2026','Сен 2026','Окт 2026','Ноя 2026','Дек 2026'];
  let cum = 0;
  let cfHtml = '';
  months.forEach(m => {
    const inc = DB.payments_in.filter(r=>r.period===m).reduce((a,r)=>a+parseFloat(r.sum_plan.replace(/\s/g,'')||0),0);
    const out = DB.payments_out.filter(r=>r.period===m).reduce((a,r)=>a+parseFloat(r.sum.replace(/\s/g,'')||0),0);
    const opx = DB.opex.filter(r=>r.period===m).reduce((a,r)=>a+parseFloat(r.sum.replace(/\s/g,'')||0),0);
    const net = inc - out - opx;
    cum += net;
    const nc = net >= 0 ? 'var(--green)' : 'var(--red)';
    const cc = cum >= 0 ? 'var(--green)' : 'var(--red)';
    cfHtml += `<tr>
      <td class="mono">${m}</td>
      <td class="amount">${inc ? '₽'+inc.toLocaleString('ru-RU') : '—'}</td>
      <td class="mono" style="color:var(--red)">${out ? '−₽'+out.toLocaleString('ru-RU') : '—'}</td>
      <td class="mono" style="color:var(--muted)">${opx ? '−₽'+opx.toLocaleString('ru-RU') : '—'}</td>
      <td class="mono" style="color:${nc};font-weight:500">${net >= 0 ? '+' : ''}₽${net.toLocaleString('ru-RU')}</td>
      <td class="mono" style="color:${cc}">${cum >= 0 ? '+' : ''}₽${cum.toLocaleString('ru-RU')}</td>
    </tr>`;
  });
  setTimeout(()=>{ const el=document.getElementById('cf-tbody'); if(el) el.innerHTML=cfHtml; },50);
}

function _plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function _clientCntLabel(arr) {
  return arr.length === 1 ? arr[0] : arr.length + ' ' + _plural(arr.length, 'клиент', 'клиента', 'клиентов');
}
function _roleSummaryStr(rs) {
  const p = [];
  if (rs.includes('client')) p.push('Менеджер');
  if (rs.includes('buying')) p.push('Баер');
  return p.join(' + ');
}

function toggleClientRole(el) {
  const me = USERS[currentUser];
  if (!me || me.role !== 'admin') { alert('Роли по проектам меняет только Head of Agency'); return; }
  const uid = el.dataset.uid, client = el.dataset.client, side = el.dataset.side;
  const u = USERS[uid]; if (!u) return;
  ensureClientRoles(u);
  const arr = u.clientRoles[client] || [];
  const has = arr.includes(side);
  const next = has ? arr.filter(s => s !== side) : arr.concat(side);
  if (next.length === 2 && !confirm(u.name + ' будет одновременно менеджером и баером по «' + client + '».\n\nЕсть риск конфликта интересов (сам ведёт клиента и сам закупает). Продолжить?')) return;
  if (!next.length) {
    if (!confirm('Убрать у ' + u.name + ' клиента «' + client + '» полностью?')) return;
    delete u.clientRoles[client];
    u.clients = (u.clients || []).filter(c => c !== client);
    addAuditEntry('Доступы', u.name, client, _roleSummaryStr(arr), 'убран');
  } else {
    u.clientRoles[client] = next;
    if (!(u.clients || []).includes(client)) u.clients = (u.clients || []).concat(client);
    addAuditEntry('Доступы', u.name, client, _roleSummaryStr(arr) || '—', _roleSummaryStr(next));
  }
  saveDB();
  showTab('access');
}

              const rs = mgrRoles(mu, c);
              const tog = (side, label) => {
                const on = rs.includes(side);
                const col = side === 'client' ? '#2d7a4f' : '#2c5f8a';
                const bg  = side === 'client' ? '#eef7f2' : '#eef2f9';

              };
              return '<span class="mtag" style="margin:2px 6px 2px 0;padding:3px 8px">' + c + tog('client','М') + tog('buying','Б') + '</span>';

            const addBtn2 = canManage ? ' <button onclick="openAssignClientModal(this.dataset.uid)" data-uid="' + uid + '" style="font-size:10px;padding:2px 8px;cursor:pointer;border:1px dashed var(--border2);background:transparent;color:var(--muted);vertical-align:middle">+ клиент</button>' : '';

            return `<tr><td class="main">${mu.name}</td><td>${chips}${addBtn2}</td><td>${summary}</td></tr>`;

// Fuzzy/contains search — ищет по любой части названия и юрлица
function fuzzyMatch(text, query) {
  if (!text || !query) return false;
  const t = text.toLowerCase();
  const q = query.toLowerCase();
  // Direct contains
  if (t.includes(q)) return true;
  // Each word in query must appear somewhere
  const words = q.split(/\s+/).filter(Boolean);
  return words.every(w => t.includes(w));
}

function acSuggest(inputId, source, query) {
  const dd = document.getElementById('ac-' + inputId);
  if (!dd) return;
  if (!query || query.length < 1) { dd.style.display = 'none'; return; }
  const items = source === 'clients' ? DB.clients : DB.vendors;
  // Search across name, legal, inn
  const matches = items.filter(i =>
    fuzzyMatch(i.name, query) ||
    fuzzyMatch(i.legal, query) ||
    fuzzyMatch(i.inn, query)
  );
  if (!matches.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = matches.map(i => {
    const safeName = i.name.replace(/"/g,'&quot;');
    const sub = [(i.legal && i.legal !== '—' && i.legal !== i.name ? i.legal : ''), (i.inn && i.inn !== '—' ? 'ИНН ' + i.inn : '')].filter(Boolean).join(' · ');
    return '<div class="ac-item" data-id="' + i.id + '" data-name="' + safeName + '" data-source="' + source + '" data-inputid="' + inputId + '" onclick="acSelectEl(this)">' + i.name + (sub ? '<small>' + sub + '</small>' : '') + '</div>';
  }).join('');
  dd.style.display = 'block';
}

// Static suggestions (period, media, service) from existing DB data
function getPeriodSuggestions() {
  const months = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  const from_db = [...new Set(DB.deals.map(d => d.period))];
  // Current and next year first
  const currentYear = new Date().getFullYear();
  const primary = months.map(m => m + ' ' + currentYear);
  const secondary = months.map(m => m + ' ' + (currentYear+1));
  const tertiary = months.map(m => m + ' ' + (currentYear+2));
  return [...new Set([...from_db, ...primary, ...secondary, ...tertiary])];
}

function getMediaSuggestions() {
  const from_db = [...new Set(DB.deals.map(d => d.media).filter(Boolean))];
  const defaults = ['Digital','Social','OOH','TV','Radio','In-Game','Influencers','Production','Prize Fund','Social / Promo','Social / Seeding','Digital / Influencers','Production / Tech'];
  return [...new Set([...from_db, ...defaults])];
}

function getServiceSuggestions(query) {
  // Returns approved service formulations matching query
  const q = (query||'').toLowerCase();
  const approved = DB.service_templates.filter(t => t.approved_by === 'nastya');
  return approved
    .filter(t => !q || t.text.toLowerCase().includes(q))
    .sort((a,b) => b.used_count - a.used_count)
    .map(t => t.text);
}

function getServiceSuggestionsLegacy() {
  return [...new Set(DB.deals.map(d => d.service).filter(s => s && s !== '—'))];
}

function initStickyScrollbars() {
  document.querySelectorAll('.table-wrap').forEach(wrap => {
    if (wrap.nextElementSibling && wrap.nextElementSibling.classList.contains('sticky-scroll-wrap')) return;
    const mirror = document.createElement('div');
    mirror.className = 'sticky-scroll-wrap';
    const inner = document.createElement('div');
    inner.className = 'sticky-scroll-inner';
    mirror.appendChild(inner);
    wrap.parentNode.insertBefore(mirror, wrap.nextSibling);
    const syncWidth = () => { const tbl = wrap.querySelector('table'); if (tbl) inner.style.width = tbl.scrollWidth + 'px'; };
    syncWidth();
    mirror.addEventListener('scroll', () => { wrap.scrollLeft = mirror.scrollLeft; });
    wrap.addEventListener('scroll', () => { mirror.scrollLeft = wrap.scrollLeft; });
  });
}

let _payIdSeq = 0;
function newPayId() {
  // Уникальный id: не пересекается ни с демо (1..N, 200+), ни со старыми авто (8000/9000+)
  _payIdSeq += 1;
  return 100000 + (Date.now() % 100000000) * 10 + (_payIdSeq % 10);
}

function syncDealsToPayments() {
  // Для каждой сделки — создать/обновить строку в payments_in (клиент) или payments_out (баинг)
  DB.deals.forEach(deal => {
    const isBuyerDeal = sideOfDeal(deal) === 'buying';

    if (isBuyerDeal) {
      // Баинговая сделка → payments_out
      const exists = DB.payments_out.find(p =>
        (p._deal_id === deal.id) ||
        (!p._auto && p.client === deal.client && p.period === deal.period && p.vendor === deal.vendor)
      );
      if (!exists && deal.period) {
        DB.payments_out.push({
          id: newPayId(),
          _deal_id: deal.id,
          vendor:    deal.vendor || '—',
          client:    deal.client,
          period:    deal.period,
          sum:       deal.budget_p,
          tax_type:  deal.tax_type || 'НДС 22%',
          date_plan: deal.pay_plan || '—',
          date_fact: deal.pay_fact || '—',
          status:    deal.pay_fact && deal.pay_fact !== '—' ? 'Оплачено' : 'В работе',
          manager:   deal.manager,
          _auto: true,
        });
      } else if (exists && deal.budget_p && deal.budget_p !== '—') {
        // Обновить если изменилось
        exists.sum       = deal.budget_p;
        exists.tax_type  = deal.tax_type || 'НДС 22%';
        exists.date_plan = deal.pay_plan || '—';
        exists.date_fact = deal.pay_fact || '—';
        exists.status    = deal.pay_fact && deal.pay_fact !== '—' ? 'Оплачено' : 'В работе';
        exists.manager   = deal.manager;
      }
    } else {
      // Клиентская сделка → payments_in
      const exists = DB.payments_in.find(p =>
        (p._deal_id === deal.id) ||
        (!p._auto && p.client === deal.client && p.period === deal.period)
      );
      // Считаем сумму: budget_p + av_sum = то что платит клиент
      const bp  = parseFloat((deal.budget_p||'0').replace(/[\s\u00a0]/g,'')) || 0;
      const av  = parseFloat((deal.av_sum||'0').replace(/[\s\u00a0]/g,'')) || 0;
      const total = bp + av > 0 ? (bp + av).toString() : bp > 0 ? bp.toString() : null;
      if (!total && deal.budget_p === '—' && !deal.pay_plan) return; // нет данных — не добавляем
      const safeTotal = total || '0';
      if (!exists) {
        DB.payments_in.push({
          id: newPayId(),
          _deal_id:   deal.id,
          client:     deal.client,
          period:     deal.period,
          sum_plan:   safeTotal,
          sum_fact:   deal.budget_f && deal.budget_f !== '—' ? deal.budget_f : '—',
          tax_type:   deal.tax_type || 'НДС 22%',
          date_issue: deal.pay_plan || '—',
          date_pay:   deal.pay_fact || '—',
          status:     deal.pay_fact && deal.pay_fact !== '—' ? 'Оплачен' : 'В работе',
          manager:    deal.manager,
          _auto: true,
        });
      } else {
        // Обновить
        exists.sum_plan  = total;
        exists.sum_fact  = deal.budget_f && deal.budget_f !== '—' ? deal.budget_f : '—';
        exists.tax_type  = deal.tax_type || 'НДС 22%';
        exists.date_issue = deal.pay_plan || '—';
        exists.date_pay  = deal.pay_fact || '—';
        exists.status    = deal.pay_fact && deal.pay_fact !== '—' ? 'Оплачен' : 'В работе';
        exists.manager   = deal.manager;
      }
    }
  });
  // Удалить авто-строки для удалённых сделок
  const dealIds = new Set(DB.deals.map(d => d.id));
  DB.payments_in  = DB.payments_in.filter(p => !p._auto || dealIds.has(p._deal_id));
  DB.payments_out = DB.payments_out.filter(p => !p._auto || dealIds.has(p._deal_id));
}

function filterRows(rows, table) {
  const u = USERS[currentUser];
  const role = u.role;
  const isManager = role === 'manager';
  let r = rows;
  if (isManager) {
    if (table === 'payments_in') {
      r = r.filter(row => mgrClients(u,'client').includes(row.client));
    } else if (table === 'payments_out') {
      r = r.filter(row => mgrClients(u,'buying').includes(row.client) && row.manager === u.name);
    } else if (table === 'deals') {
      r = r.filter(row => {
        const side = sideOfDeal(row);
        if (side === 'buying') return mgrClients(u,'buying').includes(row.client) && row.manager === u.name;
        return mgrClients(u,'client').includes(row.client);
      });
    } else {
      r = r.filter(row => u.clients && u.clients.includes(row.client || row.vendor));
    }
  }
  const fs = filterStatus[table] || 'all';
  if (fs !== 'all') r = r.filter(row => row.status === fs);
  const fm = filterManager.deals || 'all';
  if (table === 'deals' && fm !== 'all') r = r.filter(row => row.manager === fm);
  return r;
}

function filterStatusCount(table, status) {
  const rows = table === 'payments_in' ? DB.payments_in : table === 'payments_out' ? DB.payments_out : DB.deals;

}

function saveDealRow(id) {
  const deal = DB.deals.find(d => d.id === id);
  if (!deal) return;
  const orig = window._editingOriginal || {};
  const row = document.querySelector('[data-deal-id="' + id + '"]');
  if (!row) return;
  const changes = [];
  const editableKeys = ['client','period','media','region','vendor','service','budget_p','budget_f','tax_type','sk','sk_date','ret','ret_date','pay_plan','pay_fact','contract','appendix','act','note','manager','nb_fee','client_ret','interest_pct','target_margin'];
  row.querySelectorAll('[data-editkey]').forEach(inp => {
    const key = inp.dataset.editkey;
    if (!editableKeys.includes(key)) return;
    let newVal = inp.tagName === 'TEXTAREA' ? inp.value : inp.value || '—';
    if ((key==='pay_plan'||key==='pay_fact'||key==='sk_date'||key==='ret_date') && newVal && newVal!=='—' && newVal.includes('-')) {
      const p = newVal.split('-'); newVal = p[2]+'.'+p[1]+'.'+p[0];
    }
    if (key === 'act') newVal = (inp.value||'').split('\n').map(s=>s.trim()).filter(Boolean).join('|') || '—';
    if (newVal === '') newVal = '—';
    if (deal[key] !== newVal) {
      changes.push({field:key, from:deal[key], to:newVal});
      deal[key] = newVal;
      if (key === 'note') { const u = USERS[currentUser]; notifyMentions(u.name, deal.client, deal.period, newVal, deal.id); }
    }
  });
  if (changes.length > 0) {
    changes.forEach(c => addAuditEntry('Сделка', deal.client + ' / ' + deal.period, c.field, c.from, c.to));
    // Этап 7: изменения денег в ходе работы — только с повторным апрувом.
    const MONEY_KEYS = ['budget_p','budget_f','av_pct','av_sum','sk','ret','nb_fee','client_ret','tax_type','interest_pct'];
    const moneyChanged = changes.filter(c => MONEY_KEYS.includes(c.field));
    if (moneyChanged.length && deal.deal_status !== 'Черновик' && deal.deal_status !== 'Закрыта'
        && (deal.approve_alex || deal.approve_nastya || deal.approve_rodion)) {
      resetApprovals(deal, moneyChanged.map(c => c.field).join(', '));
    }
  }
  window._editingOriginal = null;
  window._editingId = null;
  const banner = document.getElementById('edit-banner');
  if (banner) banner.remove();
  saveDB();
  setTimeout(checkMentions, 50); // notify @mentions in note
  showTab('deals');
}function cancelEditDeal() {
  if (window._editingOriginal && window._editingId) {
    const id = window._editingId;
    const deal = DB.deals.find(d => d.id === id);

  }
  window._editingOriginal = null; window._editingId = null;
  const banner = document.getElementById('edit-banner');
  if (banner) banner.remove();
  showTab('deals');
}

function deptOf(manager) {
  const k = Object.keys(USERS).find(u => USERS[u].name === manager);
  return k ? (USERS[k].dept || '') : '';
}

// ============================================================
// PER-PROJECT MANAGER ROLES: 'client' (М) | 'buying' (Б)
// clientRoles: { 'Имя клиента': ['client','buying'] }
// Фоллбэк — глобальный dept, поэтому старые данные работают как раньше
// ============================================================
function ensureClientRoles(u) {
  if (!u.clientRoles) {
    u.clientRoles = {};
    const def = (u.dept === 'Баинг') ? 'buying' : 'client';
    (u.clients || []).forEach(c => { u.clientRoles[c] = [def]; });
  }
  return u.clientRoles;
}
function mgrRoles(u, client) {
  if (!u || (u.role !== 'manager' && u.role !== 'manager_client')) return [];
  if (u.clientRoles && u.clientRoles[client]) return u.clientRoles[client];
  if (u.clients && u.clients.includes(client)) return [(u.dept === 'Баинг') ? 'buying' : 'client'];
  return [];
}
function mgrClients(u, side) {
  if (!u) return [];
  return (u.clients || []).filter(c => mgrRoles(u, c).includes(side));
}
function mgrHasSide(u, side) { return mgrClients(u, side).length > 0; }
function sideOfDeal(d) {
  const k = Object.keys(USERS).find(u => USERS[u].name === d.manager);
  if (!k) return 'client';
  const mu = USERS[k];
  const rs = mgrRoles(mu, d.client);
  if (rs.length === 1) return rs[0] === 'buying' ? 'buying' : 'client';
  // обе роли или ни одной — фоллбэк на отдел менеджера
  return (mu.dept === 'Баинг') ? 'buying' : 'client';
}

function dealProfitByGroup() {
  // Прибыль = клиент бюджет − баинг бюджет + АВ + СК − возврат клиенту − интерес − НБ комиссия
  const num = (v) => parseFloat(String(v==null?'':v).replace(/[\s\u00a0₽%]/g,'').replace(',','.')) || 0;
  const groups = {};
  DB.deals.forEach(d => {
    const key = d.client + '|' + d.period;
    if (!groups[key]) groups[key] = { cbP:0, cbF:0, bbP:0, bbF:0, av:0, sk:0, ret:0, nb:0, intPct:0, tgt:0, hasFact:false };
    const g = groups[key];
    const side = sideOfDeal(d);
    if (side === 'client') {
      g.cbP += num(d.budget_p);
      if (d.budget_f && d.budget_f !== '—') { g.cbF += num(d.budget_f); g.hasFact = true; }
      g.av += num(d.av_sum);
      g.intPct = Math.max(g.intPct, num(d.interest_pct));
      g.tgt = Math.max(g.tgt, num(d.target_margin));
    } else {
      g.bbP += num(d.budget_p);
      if (d.budget_f && d.budget_f !== '—') { g.bbF += num(d.budget_f); g.hasFact = true; }
      g.sk += num(d.sk);
    }
    g.ret += num(d.ret);
    g.nb += num(d.nb_fee);
  });
  Object.values(groups).forEach(g => {
    const intP = g.cbP * g.intPct / 100;
    const intF = g.cbF * g.intPct / 100;
    g.profitP = g.cbP - g.bbP + g.av + g.sk - g.ret - intP - g.nb;
    g.profitF = g.hasFact ? (g.cbF - g.bbF + g.av + g.sk - g.ret - intF - g.nb) : null;
    g.marginF = (g.profitF != null && g.cbF > 0) ? Math.round(g.profitF / g.cbF * 100) : null;
    g.marginP = g.cbP > 0 ? Math.round(g.profitP / g.cbP * 100) : null;
  });
  return groups;
}

function buildDealsSvodRows() {
  const num = (v) => parseFloat(String(v==null?'':v).replace(/[\s\u00a0₽]/g,'').replace(',','.')) || 0;
  const fmt = (n) => n ? '₽' + Math.round(n).toLocaleString('ru-RU') : '—';
  const esc = (v) => (v==null || v==='') ? '—' : v;
  const parseDate = (s) => {
    if (!s || s === '—') return 99999999;
    const p = String(s).split('.');
    return p.length === 3 ? +p[2]*10000 + +p[1]*100 + +p[0] : 99999999;
  };

  // Each deal -> a row, side = client or buying
  const rows = DB.deals.map(d => {
    const side = sideOfDeal(d);
    return { side, period: d.period, client: d.client, sortDate: parseDate(d.pay_plan), data: d };
  });

  // Sort by period then date (like ГП svod)
  rows.sort((a,b) => {
    const pp = (typeof parsePeriod==='function' ? parsePeriod(a.period)-parsePeriod(b.period) : 0);
    return pp !== 0 ? pp : a.sortDate - b.sortDate;
  });

  if (!rows.length) return '<tr><td colspan="43" style="text-align:center;padding:20px;color:var(--dim)">Нет данных</td></tr>';

  const td = (v, extra) => '<td style="padding:7px 10px;font-size:11px;border-bottom:1px solid #c8c5be;border-right:1px solid #e0ddd6;white-space:nowrap;' + (extra||'') + '">' + v + '</td>';
  const taxOf = (sum, tt) => {
    const n = num(sum);
    const m = (String(tt||'').match(/(\d+)/)||[])[1] || (String(tt||'').indexOf('УСН')>=0?6:22);
    return Math.round(n * parseFloat(m)/100);
  };

  // Client columns (left): Юр.лицо, Формулировка, Бюджет план, Налог, Сумма налога, Итого план с нал, Итого факт с нал, АВ%, АВ сумма, Дата план, Дата факт, Договор, Прил, Акт, Статус дог, Менеджер, Прим, Статус
  const clientCells = (r) => {
    const tax = taxOf(r.budget_p, r.tax_type);
    const totalP = num(r.budget_p) + tax;
    return [
      esc(r.vendor), esc(r.service), fmt(num(r.budget_p)), esc(r.tax_type),
      tax?('+'+fmt(tax)):'—', fmt(totalP), fmt(num(r.budget_f)),
      esc(r.av_pct)+(r.av_pct&&r.av_pct!=='—'?'%':''), fmt(num(r.av_sum)),
      esc(r.pay_plan), esc(r.pay_fact), esc(r.contract), esc(r.appendix), esc(r.act),
      esc(r.contract_status), esc(r.manager), esc(r.note), esc(r.deal_status)
    ];
  };
  // Buying columns (right): Юр.лицо, Формулировка, Бюджет план, Налог, Сумма налога, Итого план с нал, Итого факт с нал, Дата план, Дата факт, Договор, Прил, Акт, Статус дог, Баер, Прим, Статус, Возврат, Дата возврата
  const buyingCells = (r) => {
    const tax = taxOf(r.budget_p, r.tax_type);
    const totalP = num(r.budget_p) + tax;
    return [
      esc(r.vendor), esc(r.service), fmt(num(r.budget_p)), esc(r.tax_type),
      tax?('+'+fmt(tax)):'—', fmt(totalP), fmt(num(r.budget_f)),
      esc(r.pay_plan), esc(r.pay_fact), esc(r.contract), esc(r.appendix), esc(r.act),
      esc(r.contract_status), esc(r.manager), esc(r.note), esc(r.deal_status),
      r.ret&&r.ret!=='—'?('−'+fmt(num(r.ret))):'—', esc(r.ret_date)
    ];
  };

  const profitGroups = dealProfitByGroup();
  const shownGroups = new Set();
  const fmtSigned = (n) => n == null ? '—' : (n < 0 ? '−₽' + Math.abs(Math.round(n)).toLocaleString('ru-RU') : '₽' + Math.round(n).toLocaleString('ru-RU'));
  const profitCells = (row) => {
    const key = row.client + '|' + row.data.period;
    const first = !shownGroups.has(key);
    shownGroups.add(key);
    const g = profitGroups[key];
    const base = 'background:#faf8f2;border-left:2px solid #999690;';
    if (!first || !g) return td('', base) + td('') + td('');
    const pP = g.profitP, pF = g.profitF;
    const colP = pP < 0 ? 'color:#c0392b;font-weight:600;' : 'color:#8a7d60;font-weight:600;';
    let mTxt = '—', mCol = '';
    if (g.marginF != null) {
      mTxt = g.marginF + '%' + (g.tgt ? ' / цель ' + g.tgt + '%' : '');
      mCol = g.tgt ? (g.marginF >= g.tgt ? 'color:#2d7a4f;font-weight:600;' : 'color:#c0392b;font-weight:600;') : '';
    } else if (g.marginP != null) {
      mTxt = 'план ' + g.marginP + '%' + (g.tgt ? ' / цель ' + g.tgt + '%' : '');
      mCol = g.tgt ? (g.marginP >= g.tgt ? 'color:#2d7a4f;' : 'color:#c07030;') : '';
    }
    return td(fmtSigned(pP), base + colP) +
           td(pF == null ? '—' : fmtSigned(pF), pF != null && pF < 0 ? 'color:#c0392b;font-weight:600;' : 'font-weight:600;') +
           td(mTxt, mCol);
  };

  const N_CLIENT = 18, N_BUY = 18;
  const emptyClient = Array(N_CLIENT).fill('').map(()=>td('', 'background:#fcfcfb')).join('');
  const emptyBuy = Array(N_BUY).fill('').map((_,i)=>td('', 'background:#fcfcfb'+(i===0?';border-left:2px solid #999690':''))).join('');

  let html = '';
  rows.forEach(row => {
    const r = row.data;
    // Common 4 cols
    const common = td(esc(row.client),'background:#f7f6f3;font-weight:500') +
                   td(esc(r.period),'background:#f7f6f3') +
                   td(esc(r.media),'background:#f7f6f3') +
                   td(esc(r.service_type),'background:#f7f6f3');
    let clientHalf, buyHalf;
    if (row.side === 'client') {
      clientHalf = clientCells(r).map((v)=>td(v,'background:#fbfdfb')).join('');
      buyHalf = emptyBuy;
    } else {
      clientHalf = emptyClient;
      buyHalf = buyingCells(r).map((v,i)=>td(v,'background:#fbfcfd'+(i===0?';border-left:2px solid #999690':''))).join('');
    }
    html += '<tr>' + common + clientHalf + buyHalf + profitCells(row) + '</tr>';
  });
  return html;
}







</script>

<script>
(function() {
  function enforceSticky() {
    document.querySelectorAll('.table-wrap').forEach(function(tw) {
      if (tw.classList.contains('note-cell') || tw.classList.contains('sticky-scroll-wrap')) return;
      tw.style.setProperty('overflow-x', 'auto', 'important');
      tw.style.setProperty('overflow-y', 'auto', 'important');
      tw.style.setProperty('max-height', 'calc(100vh - 200px)', 'important');
      var table = tw.querySelector('table');
      if (table) {
        table.style.setProperty('border-collapse', 'separate', 'important');
        table.style.setProperty('border-spacing', '0', 'important');
        // Consistent grid borders for separate mode
        table.querySelectorAll('td').forEach(function(td) {
          td.style.setProperty('border-bottom', '1px solid #999690', 'important');
          td.style.setProperty('border-right', '1px solid #c8c5be', 'important');
        });
      }
      var thead = tw.querySelector('thead');
      if (thead) {
        thead.querySelectorAll('th').forEach(function(th) {
          th.style.setProperty('position', 'sticky', 'important');
          th.style.setProperty('top', '0', 'important');
          th.style.setProperty('z-index', '10', 'important');
          th.style.setProperty('background', '#eeecea', 'important');
          th.style.setProperty('border-bottom', '2px solid #999690', 'important');
          th.style.setProperty('border-right', '1px solid #c8c5be', 'important');
          th.style.setProperty('white-space', 'normal', 'important');
          th.style.setProperty('vertical-align', 'middle', 'important');
          th.style.setProperty('line-height', '1.25', 'important');
        });
      }
    });
    if (typeof initStickyScrollbars === 'function') {
      document.querySelectorAll('.sticky-scroll-wrap').forEach(m => m.remove());
      initStickyScrollbars();
    }
  }
  document.addEventListener('DOMContentLoaded', function() {
    enforceSticky();
    setTimeout(enforceSticky, 300);
    setTimeout(enforceSticky, 800);
    var obs = new MutationObserver(function() { setTimeout(enforceSticky, 50); });
    obs.observe(document.getElementById('main-content') || document.body, {childList:true, subtree:true});
  });
})();
</script>
